# ║  Dependabot config. Goes to: <repo>/.github/dependabot.yml           ║
# ╚══════════════════════════════════════════════════════════════════════╝

version: 2

updates:
  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Asia/Kolkata" }
    commit-message: { prefix: "👷" }
    groups:
      actions:
        patterns: ["*"]

  # Node / Next.js Frontend: frontend/package.json
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Asia/Kolkata" }
    open-pull-requests-limit: 10
    commit-message: { prefix: "👆" }
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]

  # Python FastAPI DIP Backend: backend/requirements.txt
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Asia/Kolkata" }
    open-pull-requests-limit: 10
    commit-message: { prefix: "👆" }
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Docker: base image in backend/Dockerfile
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Asia/Kolkata" }
    commit-message: { prefix: "👆" }

